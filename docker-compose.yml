services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: fraud-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  kafka-init:
    image: apache/kafka:4.3.1
    container_name: fraud-kafka-init
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        echo "Checking Kafka topic: transactions"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic transactions \
          --partitions 3 \
          --replication-factor 1

        echo "Kafka topic configuration:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --describe \
          --topic transactions

        echo "Kafka initialization completed successfully."


  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    container_name: fraud-clickhouse
    restart: unless-stopped

    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: fraud_detection
      CLICKHOUSE_USER: fraud_user
      CLICKHOUSE_PASSWORD: change_me
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8123/ping || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile

    image: fraud-pyflink:2.1.3
    container_name: fraud-flink-jobmanager
    restart: unless-stopped

    command: jobmanager

    ports:
      - "8081:8081"
      - "9249:9249"

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: fraud_detection
      CLICKHOUSE_USER: fraud_user
      CLICKHOUSE_PASSWORD: change_me

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions
      KAFKA_GROUP_ID: fraud-detection-flink

      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        rest.port: 8081

        taskmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2

        python.client.executable: python3
        python.executable: python3

        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints

        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

    volumes:
      - ./flink/jobs:/opt/flink/usrlib
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8081/overview >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile

    image: fraud-pyflink:2.1.3
    container_name: fraud-flink-taskmanager
    restart: unless-stopped

    command: taskmanager

    ports:
      - "9250:9249"

    depends_on:
      jobmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: fraud_detection
      CLICKHOUSE_USER: fraud_user
      CLICKHOUSE_PASSWORD: change_me

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions
      KAFKA_GROUP_ID: fraud-detection-flink

      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager

        taskmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2

        python.client.executable: python3
        python.executable: python3

        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints

        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

    volumes:
      - ./flink/jobs:/opt/flink/usrlib
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ps aux | grep '[t]askmanager' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  job-submitter:
    image: fraud-pyflink:2.1.3
    container_name: fraud-flink-job-submitter
    restart: "no"

    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: fraud_detection
      CLICKHOUSE_USER: fraud_user
      CLICKHOUSE_PASSWORD: change_me

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions
      KAFKA_GROUP_ID: fraud-detection-flink

      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.port: 8081
        parallelism.default: 2

    volumes:
      - ./flink/jobs:/opt/flink/usrlib
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

    command:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Waiting for Flink JobManager..."

        i=0

        while [ "$$i" -lt 60 ]; do
          if curl -fsS http://jobmanager:8081/overview >/dev/null 2>&1; then
            echo "Flink JobManager is reachable."
            break
          fi

          i=$$((i + 1))
          echo "Waiting for JobManager... attempt $$i/60"
          sleep 2
        done

        if [ "$$i" -ge 60 ]; then
          echo "Timed out waiting for Flink JobManager."
          exit 1
        fi

        RUNNING=$$(curl -fsS http://jobmanager:8081/jobs/overview \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); print(any(j.get("name") == "Fraud Detection ClickHouse Pipeline" and j.get("state") == "RUNNING" for j in d.get("jobs", [])))')

        if [ "$$RUNNING" = "True" ]; then
          echo "Fraud Detection ClickHouse Pipeline is already running."
          echo "Skipping duplicate submission."
          exit 0
        fi

        echo "No running Fraud Detection ClickHouse Pipeline found."
        echo "Waiting for 2 available TaskManager slots..."

        i=0

        while [ "$$i" -lt 60 ]; do
          AVAILABLE=$$(curl -fsS http://jobmanager:8081/overview \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("slots-available", 0))' \
            2>/dev/null || echo 0)

          echo "Available slots: $$AVAILABLE"

          if [ "$$AVAILABLE" -ge 2 ] 2>/dev/null; then
            echo "TaskManager has enough available slots."
            break
          fi

          i=$$((i + 1))
          echo "Waiting for TaskManager slots... attempt $$i/60"
          sleep 2
        done

        if [ "$$i" -ge 60 ]; then
          echo "Timed out waiting for TaskManager slots."
          exit 1
        fi

        RUNNING=$$(curl -fsS http://jobmanager:8081/jobs/overview \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); print(any(j.get("name") == "Fraud Detection ClickHouse Pipeline" and j.get("state") == "RUNNING" for j in d.get("jobs", [])))')

        if [ "$$RUNNING" = "True" ]; then
          echo "Pipeline started while submitter was waiting."
          echo "Skipping duplicate submission."
          exit 0
        fi

        echo "Submitting Fraud Detection ClickHouse Pipeline..."

        flink run \
          -m jobmanager:8081 \
          -d \
          -py /opt/flink/usrlib/fraud_job.py

        echo "Flink submission command succeeded."

        echo "Waiting for job to enter RUNNING state..."

        i=0

        while [ "$$i" -lt 30 ]; do
          RUNNING=$$(curl -fsS http://jobmanager:8081/jobs/overview \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(any(j.get("name") == "Fraud Detection ClickHouse Pipeline" and j.get("state") == "RUNNING" for j in d.get("jobs", [])))' \
            2>/dev/null || echo False)

          if [ "$$RUNNING" = "True" ]; then
            echo "Fraud Detection ClickHouse Pipeline is RUNNING."
            exit 0
          fi

          i=$$((i + 1))
          echo "Waiting for RUNNING state... attempt $$i/30"
          sleep 2
        done

        echo "Job was submitted but did not reach RUNNING state in time."
        exit 1


  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    depends_on:
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9090/-/healthy || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  grafana:
    image: grafana/grafana:13.2.1
    container_name: fraud-grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards

    depends_on:
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3000/api/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


networks:
  default:
    name: real-time-fraud-detection_default


volumes:

  kafka-data:
    name: real-time-fraud-detection_kafka-data

  clickhouse-data:
    name: real-time-fraud-detection_clickhouse-data

  grafana-data:
    name: real-time-fraud-detection_grafana-data

  flink-checkpoints:
    name: real-time-fraud-detection_flink-checkpoints

  flink-savepoints:
    name: real-time-fraud-detection_flink-savepoints

  prometheus-data:
    name: real-time-fraud-detection_prometheus-data