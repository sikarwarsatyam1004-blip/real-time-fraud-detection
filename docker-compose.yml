services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: fraud-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile

    image: fraud-pyflink:2.1.3
    container_name: fraud-flink-jobmanager
    restart: unless-stopped

    command: jobmanager

    ports:
      - "8081:8081"
      - "9249:9249"

    depends_on:
      kafka:
        condition: service_healthy

      clickhouse:
        condition: service_healthy

    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: fraud_detection
      CLICKHOUSE_USER: fraud_user
      CLICKHOUSE_PASSWORD: change_me

      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager

        taskmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2

        python.client.executable: python3
        python.executable: python3

        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints

        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 60s
        execution.checkpointing.min-pause: 10s
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

    volumes:
      - ./flink/jobs:/opt/flink/usrlib
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8081/overview >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile

    image: fraud-pyflink:2.1.3
    container_name: fraud-flink-taskmanager
    restart: unless-stopped

    command: taskmanager

    depends_on:
      jobmanager:
        condition: service_healthy

      kafka:
        condition: service_healthy

      clickhouse:
        condition: service_healthy

    ports:
      - "9250:9249"

    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: fraud_detection
      CLICKHOUSE_USER: fraud_user
      CLICKHOUSE_PASSWORD: change_me

      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager

        taskmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2

        python.client.executable: python3
        python.executable: python3

        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints

        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 60s
        execution.checkpointing.min-pause: 10s
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

    volumes:
      - ./flink/jobs:/opt/flink/usrlib
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ps aux | grep '[t]askmanager' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    container_name: fraud-clickhouse
    restart: unless-stopped

    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: fraud_detection
      CLICKHOUSE_USER: fraud_user
      CLICKHOUSE_PASSWORD: change_me
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8123/ping || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  grafana:
    image: grafana/grafana:13.2.1
    container_name: fraud-grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

    volumes:
      - grafana-data:/var/lib/grafana

      - ./grafana/provisioning:/etc/grafana/provisioning

      - ./grafana/dashboards:/var/lib/grafana/dashboards

      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards

    depends_on:
      clickhouse:
        condition: service_healthy

      prometheus:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3000/api/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    depends_on:
      jobmanager:
        condition: service_started

      taskmanager:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9090/-/healthy || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


networks:
  default:
    name: real-time-fraud-detection_default


volumes:

  kafka-data:
    name: real-time-fraud-detection_kafka-data

  clickhouse-data:
    name: real-time-fraud-detection_clickhouse-data

  grafana-data:
    name: real-time-fraud-detection_grafana-data

  flink-checkpoints:
    name: real-time-fraud-detection_flink-checkpoints

  flink-savepoints:
    name: real-time-fraud-detection_flink-savepoints

  prometheus-data:
    name: real-time-fraud-detection_prometheus-data